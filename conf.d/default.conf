# Upstream backend targets pointing to host machine services
upstream web_backend {
    server host.docker.internal:3000;
}

upstream api_backend {
    server host.docker.internal:3001;
}

upstream superadmin_backend {
    server host.docker.internal:3002;
}

# 1. Default Server: Handles single Ngrok tunnel and path-based routing
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket Support (Next.js Fast Refresh / HMR & Socket.io)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 1. Stamping cookie when visiting /superadmin
    location /superadmin {
        add_header Set-Cookie "dev_target=superadmin; Path=/; SameSite=Lax" always;
        rewrite ^/superadmin/?(.*)$ /$1 break;
        proxy_pass http://superadmin_backend;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 2. Switch back to Web when visiting /web
    location /web {
        add_header Set-Cookie "dev_target=web; Path=/; SameSite=Lax" always;
        return 302 /;
    }

    # 3. Next.js Static Chunks (/_next/)
    location /_next/ {
        if ($cookie_dev_target = "superadmin") {
            proxy_pass http://superadmin_backend;
        }
        if ($http_referer ~* "/superadmin") {
            proxy_pass http://superadmin_backend;
        }
        proxy_pass http://web_backend;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 4. API Backend (Port 3001) with CORS Bypass
    location /api {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token,x-csrf-token,Accept,Origin,baggage,sentry-trace' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token,x-csrf-token,Accept,Origin,baggage,sentry-trace' always;

        proxy_set_header Origin "http://localhost:3000";

        proxy_pass http://api_backend;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 5. Root & Sub-paths (Handles client-side router navigation to /login, /dashboard, etc.)
    location / {
        # If your browser session is in Superadmin mode, keep serving Port 3002!
        if ($cookie_dev_target = "superadmin") {
            proxy_pass http://superadmin_backend;
            break;
        }

        proxy_set_header Accept-Encoding "";
        sub_filter_types text/javascript application/javascript application/json;
        sub_filter_once off;
        sub_filter 'http://192.168.0.203:3001/api' '/api';
        sub_filter 'http://192.168.0.203:3001' '/api';
        sub_filter 'http://localhost:3001/api' '/api';
        sub_filter 'http://localhost:3001' '/api';

        proxy_pass http://web_backend;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
